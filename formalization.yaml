version: v0.4
project:
  name: Exact determination of the book Ramsey number R(B5,B9) = 29
  description: The exact two-colour book Ramsey number R(B5,B9) is 29. The proof combines
    a 28-vertex explicit colouring, degree and deficit identities, a finite degree
    classification, and elimination of all surviving 29-vertex cases. The formal statement
    asserts the least order forcing a red five-page or blue nine-page book. Originality
    is not independently confirmed.
  authors:
